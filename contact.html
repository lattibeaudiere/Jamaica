<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaican Restaurant - Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --brand-red: #B91C1C; /* Tailwind red-700 */
        --brand-yellow: #F59E0B; /* Tailwind amber-500 */
        --brand-green: #15803D; /* Tailwind green-700 */
        --brand-black: #000000; /* Black */
        --brand-text-dark: #1F2937; /* Tailwind gray-800 */
        --brand-nav-link: #FFFFFF; /* White */
        --brand-bg-light: #F9FAFB; /* Tailwind gray-50 */
      }
    </style>
</head>
<body class="bg-white text-[var(--brand-text-dark)] font-sans">
<nav class="bg-[var(--brand-red)] p-4 sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
        <div class="text-[var(--brand-nav-link)] text-2xl font-bold">
            Island Bites <!-- Placeholder for Logo/Site Name -->
        </div>
        <div class="md:hidden">
            <button id="hamburger-button" class="text-[var(--brand-nav-link)] focus:outline-none">
                <svg id="hamburger-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                <svg id="hamburger-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden absolute md:static top-[68px] left-0 w-full md:w-auto md:flex md:items-center md:space-x-4 bg-[var(--brand-red)] md:bg-transparent shadow-md md:shadow-none rounded-b-lg md:rounded-none py-2 md:py-0 z-40">
            <a href="index.html" class="block md:inline-block text-[var(--brand-nav-link)] hover:text-[var(--brand-yellow)] px-4 py-2 md:px-2">Home</a>
            <a href="menu.html" class="block md:inline-block text-[var(--brand-nav-link)] hover:text-[var(--brand-yellow)] px-4 py-2 md:px-2">Menu</a>
            <a href="catering.html" class="block md:inline-block text-[var(--brand-nav-link)] hover:text-[var(--brand-yellow)] px-4 py-2 md:px-2">Catering</a>
            <a href="contact.html" class="block md:inline-block text-[var(--brand-nav-link)] hover:text-[var(--brand-yellow)] px-4 py-2 md:px-2">Contact Us</a>
        </div>
    </div>
</nav>

    <div class="container mx-auto p-4 md:p-8 shadow-lg bg-white my-4">
        <h1 class="text-4xl font-bold text-[var(--brand-red)] mb-6 text-center">Get In Touch</h1>

        <section id="visit-us" class="mb-6">
            <h2 class="text-2xl font-semibold text-[var(--brand-red)] mb-3">Visit Us</h2>
            <p class="leading-relaxed">123 Sunshine Avenue<br>Kingston, Jamaica</p>
        </section>

        <section id="call-us" class="mb-6">
            <h2 class="text-2xl font-semibold text-[var(--brand-red)] mb-3">Call Us</h2>
            <p class="leading-relaxed">Phone: (555) 123-4567</p>
        </section>

        <section id="email-us" class="mb-6">
            <h2 class="text-2xl font-semibold text-[var(--brand-red)] mb-3">Email Us</h2>
            <p class="leading-relaxed">Email: info@islandbites.example.com</p>
        </section>

        <section id="find-us" class="mb-6">
            <h2 class="text-2xl font-semibold text-[var(--brand-red)] mb-3">Find Us</h2>
            <p class="leading-relaxed mb-4">[Interactive Map Coming Soon!]</p>
            <img src="images/placeholder-map.png" alt="Map to Island Bites" class="w-full rounded-lg shadow-md mt-2">
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
